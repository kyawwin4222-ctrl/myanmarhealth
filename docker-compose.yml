version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: myanmarhealth_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myanmarhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myanmarhealth_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-myanmarhealth_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myanmarhealth} -d ${POSTGRES_DB:-myanmarhealth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Myanmar Health App (Frontend + Go Backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myanmarhealth_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER:-myanmarhealth}:${POSTGRES_PASSWORD:-myanmarhealth_secret_pass}@postgres:5432/${POSTGRES_DB:-myanmarhealth_db}?sslmode=disable
    volumes:
      - ./backend/data:/app/data
      - ./public/assets:/app/public/assets

volumes:
  postgres_data:
    driver: local
